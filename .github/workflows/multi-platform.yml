name: Build Geode Mod

permissions:
  contents: write

on:
  workflow_dispatch: # run it manually any time from the Actions tab

jobs:

  build:
    continue-on-error: true # continue even if build failed for some platform
    strategy:

      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Android64
          os: ubuntu-latest
          target: Android64

        - name: Android32
          os: ubuntu-latest
          target: Android32

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # sdk: nightly
          combine: true
          target: ${{ matrix.config.target }}

  upload:
    name: Combine and upload builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:

      - name: "Combine builds"
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
          retention-days: 90

      - name: "Set up Git repository"
        uses: actions/checkout@v4

      # Always-available download: Releases page -> "Development Release" (tag: nightly).
      # Every run replaces the .geode file there with the newest build.
      - name: "Development Release"
        uses: ncipollo/release-action@v1
        with:
          name: "Development Release"
          body: |
           Latest successful manual build of `${{ github.head_ref || github.ref_name }}`.
           Built by workflow run [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          tag: "nightly"
          commit: ${{ github.sha }}
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: "${{ steps.build.outputs.build-output }}/*"
